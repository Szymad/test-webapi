services:
  api:
    build:
      context: ./src
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=SaveDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Local_dev_Passw0rd!};TrustServerCertificate=True;Encrypt=True"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build:
      context: ./src
      dockerfile: Dockerfile
      target: migrations
    profiles: ["migration"]
    command: ["database", "update"]
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=SaveDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Local_dev_Passw0rd!};TrustServerCertificate=True;Encrypt=True"
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Local_dev_Passw0rd!}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1433'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  sqlserver-data:
name: Terraform Stage 1

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - name: Get runner public IP
        id: runner-ip
        run: |
          ip=$(curl --fail --silent --show-error --ipv4 https://api.ipify.org)
          ip=$(python3 -c 'import ipaddress, sys; print(ipaddress.IPv4Address(sys.argv[1]))' "$ip")
          printf 'ip=%s\n' "$ip" >> "$GITHUB_OUTPUT"

      - name: Terraform Init
        working-directory: infrastructure/terraform/stage1
        run: terraform init

      - name: Terraform Plan
        working-directory: infrastructure/terraform/stage1
        env:
          TF_VAR_external_api_key: ${{ vars.EXTERNAL_API_KEY }}
          TF_VAR_terraform_client_ip: ${{ steps.runner-ip.outputs.ip }}
          TF_VAR_github_actions_client_id: ${{ secrets.AZURE_CLIENT_ID }}
        run: terraform plan